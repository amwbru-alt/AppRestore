name: Signed GUI release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful GUI build run for THIS commit (both Mac and Windows)
        required: true
        type: string
      version:
        description: Version matching pyproject.toml, e.g. 0.5.0
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify trusted build and version
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess,tomllib
          run_id=os.environ['BUILD_RUN_ID']
          if not run_id.isdigit():raise SystemExit('Invalid run ID')
          repo=os.environ['GITHUB_REPOSITORY']
          run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
          if run['conclusion']!='success' or run['head_sha']!=os.environ['EXPECTED_SHA'] or run['head_repository']['full_name']!=repo or run['path']!='.github/workflows/gui-build.yml' or run['event']!='workflow_dispatch':raise SystemExit('Only a successful trusted GUI build of this commit may be signed')
          version=os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'\d+\.\d+\.\d+',version) or tomllib.load(open('pyproject.toml','rb'))['project']['version']!=version:raise SystemExit('Version mismatch')
          PY
  windows:
    needs: verify
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: AppRevive-GUI-Windows
          path: unsigned
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Import signing certificate and sign
        shell: pwsh
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if (!$env:WIN_CERT_BASE64 -or !$env:WIN_CERT_PASSWORD) { throw 'Configure Windows signing secrets in the release environment' }
          $certPath = Join-Path $env:RUNNER_TEMP 'apprevive-sign.pfx'
          [IO.File]::WriteAllBytes($certPath,[Convert]::FromBase64String($env:WIN_CERT_BASE64))
          try {
            $password = ConvertTo-SecureString $env:WIN_CERT_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $env:WIN_CERT_THUMBPRINT = $cert.Thumbprint
            $env:SIGNTOOL = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1).FullName
            python packaging/sign_release.py unsigned/AppRevive-GUI-Windows.zip --out signed
            if ($LASTEXITCODE -ne 0) { throw 'Signing failed' }
          } finally {
            Remove-Item $certPath -ErrorAction SilentlyContinue
            if ($cert) { Remove-Item ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Signed-Windows
          path: signed/*
          if-no-files-found: error
  macos:
    needs: verify
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: AppRevive-GUI-macOS
          path: unsigned
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Sign, notarize and staple
        env:
          MAC_CERT_BASE64: ${{ secrets.MAC_CERT_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${MAC_CERT_BASE64:?Configure release secrets}"
          : "${APPLE_API_KEY_BASE64:?Configure notary secrets}"
          cert_file="$RUNNER_TEMP/apprevive-sign.p12"
          keychain_file="$RUNNER_TEMP/apprevive-sign.keychain-db"
          export APPLE_API_KEY_FILE="$RUNNER_TEMP/apprevive-notary.p8"
          task_keychain_password="$(openssl rand -hex 24)"
          echo "::add-mask::$task_keychain_password"
          trap 'security delete-keychain "$keychain_file" >/dev/null 2>&1 || true; rm -f "$cert_file" "$APPLE_API_KEY_FILE"' EXIT
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'],'apprevive-sign.p12').write_bytes(base64.b64decode(os.environ['MAC_CERT_BASE64']))
          Path(os.environ['APPLE_API_KEY_FILE']).write_bytes(base64.b64decode(os.environ['APPLE_API_KEY_BASE64']))
          PY
          security create-keychain -p "$task_keychain_password" "$keychain_file"
          security unlock-keychain -p "$task_keychain_password" "$keychain_file"
          security set-keychain-settings -lut 21600 "$keychain_file"
          security import "$cert_file" -k "$keychain_file" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_file" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$task_keychain_password" "$keychain_file" >/dev/null
          python3 packaging/sign_release.py unsigned/AppRevive-GUI-macOS.zip --out signed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Signed-macOS
          path: signed/*
          if-no-files-found: error
  release:
    needs: [windows,macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: Signed-*
          merge-multiple: true
          path: release-assets
      - name: Publish signed release for the in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check AppRevive-GUI-Windows.zip.sha256
          sha256sum --check AppRevive-GUI-macOS.zip.sha256
          cat AppRevive-GUI-Windows.zip.sha256 AppRevive-GUI-macOS.zip.sha256 > SHA256SUMS.txt
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AppRevive $RELEASE_VERSION" --notes 'Подписанные сборки AppRevive для Windows и macOS. macOS прошла notarization.' --latest AppRevive-GUI-Windows.zip AppRevive-GUI-macOS.zip SHA256SUMS.txt
